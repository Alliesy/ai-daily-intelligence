name: Validate Supabase importer

on:
  pull_request:
    paths:
      - ".github/workflows/sync-supabase.yml"
      - ".github/workflows/validate-importer.yml"
      - "data/daily/**"
      - "data/identity/**"
      - "schema/**"
      - "packages/importer/**"
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the proposed snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify contracts, tests and build
        run: |
          pnpm test
          pnpm lint
          pnpm build

      - name: Dry-run the complete proposed archive
        shell: bash
        run: |
          set -euo pipefail
          node packages/importer/dist/cli.js \
            --mode dry-run \
            --commit "${GITHUB_SHA}" \
            --remote-main "${GITHUB_SHA}" \
            --repo-root "${GITHUB_WORKSPACE}"
